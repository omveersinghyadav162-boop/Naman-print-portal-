<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAMAN PRINT PORTAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5fb;font-family:Arial;color:#172538}
header{background:#12345a;color:white;padding:20px;text-align:center}
header h2{margin:0}
.container{max-width:900px;margin:20px auto;padding:12px}
.card{background:white;padding:20px;margin-bottom:16px;border-radius:12px;box-shadow:0 3px 12px #0001}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd5e0;border-radius:7px;font-size:15px}
button{background:#1769aa;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer;margin:4px}
button:disabled{opacity:.5}
.red{background:#c62828}
.green{background:#18864b}
.hidden{display:none}
table{width:100%;border-collapse:collapse;min-width:650px}
th,td{padding:10px;border:1px solid #ddd;text-align:left;font-size:13px}
th{background:#e8f1fa}
.tablewrap{overflow-x:auto}
.msg{padding:10px;color:#1769aa}
h3{color:#12345a}
</style>
</head>
<body>

<header>
<h2>NAMAN PRINT PORTAL</h2>
<p>Online Printing & Digital Services</p>
</header>

<div class="container">

<div class="card" id="authBox">
<h3>Customer / Admin Login</h3>
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">
<button onclick="login()">Login</button>
<button class="green" onclick="register()">New Registration</button>
<p id="authMsg" class="msg"></p>
</div>

<div id="customerBox" class="hidden">

<div class="card">
<h3>नया ऑर्डर बुक करें</h3>
<input id="customerName" placeholder="ग्राहक का नाम">
<input id="phone" placeholder="मोबाइल नंबर" type="tel">

<label>Service चुनें</label>
<select id="service">
<option value="">Service चुनें</option>
<option>PAN Card</option>
<option>Aadhaar Card</option>
<option>Printout</option>
<option>Photocopy</option>
<option>Photo</option>
<option>Online Form</option>
<option>Other</option>
</select>

<input id="qty" type="number" min="1" value="1" placeholder="Quantity">

<select id="delivery">
<option value="Normal">Normal Delivery</option>
<option value="Urgent">Urgent Delivery</option>
</select>

<textarea id="details" placeholder="अन्य जानकारी"></textarea>

<button id="orderBtn" class="green" onclick="placeOrder()">ऑर्डर बुक करें</button>
<p id="orderMsg" class="msg"></p>
</div>

<div class="card">
<h3>मेरे ऑर्डर</h3>
<button onclick="myOrders()">Refresh Orders</button>
<div id="myOrderList"></div>
</div>

</div>

<div id="adminBox" class="hidden">
<div class="card">
<h3>Admin Dashboard</h3>
<h2 id="totalOrders">कुल ऑर्डर: 0</h2>
<button onclick="loadOrders()">Refresh Orders</button>
<div class="tablewrap">
<table>
<thead>
<tr>
<th>Order No.</th>
<th>Customer</th>
<th>Mobile</th>
<th>Service</th>
<th>Qty</th>
<th>Status</th>
<th>Update</th>
</tr>
</thead>
<tbody id="ordersList"></tbody>
</table>
</div>
<p id="adminMsg" class="msg"></p>
</div>
</div>

<div class="card hidden" id="logoutBox">
<button class="red" onclick="logout()">Logout</button>
</div>

</div>

<script>
const SUPABASE_URL="https://nkcqfrfbxjdklprtbmwb.supabase.co";
const SUPABASE_KEY="sb_publishable_sNCyxl8c_knUdRd5Zg6UkQ_QFkKwPom";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="omveersinghyadav162@gmail.com";

let currentUser=null;

function show(id){
["authBox","customerBox","adminBox","logoutBox"].forEach(x=>{
document.getElementById(x).classList.add("hidden");
});
document.getElementById(id).classList.remove("hidden");
}

async function register(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

if(!email || password.length<6){
authMsg.textContent="Email और कम से कम 6 अक्षर का Password डालें";
return;
}

const {error}=await db.auth.signUp({email,password});
authMsg.textContent=error?error.message:"Registration सफल! Email confirmation की जरूरत हो सकती है।";
}

async function login(){
const email=document.getElementById("email").value.trim();
const password=document.getElementById("password").value;

const {data,error}=await db.auth.signInWithPassword({email,password});

if(error){
authMsg.textContent=error.message;
return;
}

currentUser=data.user;
openDashboard();
}

async function openDashboard(){
if(!currentUser)return;

show("logoutBox");

if(currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
show("adminBox");
await loadOrders();
}else{
show("customerBox");
await myOrders();
}
}

async function placeOrder(){
const name=document.getElementById("customerName").value.trim();
const phone=document.getElementById("phone").value.trim();
const service=document.getElementById("service").value;
const qty=Number(document.getElementById("qty").value);
const delivery=document.getElementById("delivery").value;
const details=document.getElementById("details").value.trim();

if(!name||!phone||!service||qty<1){
orderMsg.textContent="सभी जरूरी जानकारी भरें";
return;
}

const order={
order_no:"NPP"+Date.now(),
user_id:currentUser.id,
name:name,
phone:phone,
service:service,
qty:qty,
delivery:delivery,
details:details,
status:"नया ऑर्डर"
};

orderBtn.disabled=true;
orderMsg.textContent="ऑर्डर सेव हो रहा है...";

const {data,error}=await db.from("orders").insert(order).select();

orderBtn.disabled=false;

if(error){
orderMsg.textContent="Error: "+error.message;
return;
}

orderMsg.textContent="ऑर्डर सफलतापूर्वक सेव हुआ! Order No: "+data[0].order_no;

document.getElementById("service").value="";
document.getElementById("details").value="";
document.getElementById("qty").value=1;

myOrders();
}

async function myOrders(){
const {data,error}=await db.from("orders")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});

if(error){
myOrderList.textContent=error.message;
return;
}

if(!data.length){
myOrderList.textContent="अभी कोई ऑर्डर नहीं है।";
return;
}

myOrderList.innerHTML=data.map(o=>`
<div class="card">
<b>Order:</b> ${o.order_no||o.id}<br>
<b>Service:</b> ${o.service}<br>
<b>Quantity:</b> ${o.qty}<br>
<b>Status:</b> ${o.status}
</div>
`).join("");
}

async function loadOrders(){
const {data,error}=await db.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){
adminMsg.textContent="Error: "+error.message;
return;
}

totalOrders.textContent="कुल ऑर्डर: "+data.length;

ordersList.innerHTML=data.map(o=>`
<tr>
<td>${o.order_no||o.id}</td>
<td>${o.name||""}</td>
<td>${o.phone||""}</td>
<td>${o.service||""}</td>
<td>${o.qty||""}</td>
<td>${o.status||""}</td>
<td>
<select id="status${o.id}">
<option ${o.status==="नया ऑर्डर"?"selected":""}>नया ऑर्डर</option>
<option ${o.status==="स्वीकार किया"?"selected":""}>स्वीकार किया</option>
<option ${o.status==="काम जारी"?"selected":""}>काम जारी</option>
<option ${o.status==="पूरा हुआ"?"selected":""}>पूरा हुआ</option>
<option ${o.status==="रद्द"?"selected":""}>रद्द</option>
</select>
<button onclick="updateStatus('${o.id}')">Update</button>
</td>
</tr>
`).join("");
}

async function updateStatus(id){
const status=document.getElementById("status"+id).value;

const {error}=await db.from("orders")
.update({status:status})
.eq("id",id);

if(error){
adminMsg.textContent=error.message;
return;
}

adminMsg.textContent="Status सफलतापूर्वक Update हुआ!";
loadOrders();
}

async function logout(){
await db.auth.signOut();
currentUser=null;
show("authBox");
authMsg.textContent="आप Logout हो गए हैं।";
}

db.auth.getSession().then(({data})=>{
if(data.session){
currentUser=data.session.user;
openDashboard();
}else{
show("authBox");
}
});
</script>
</body>
</html>
