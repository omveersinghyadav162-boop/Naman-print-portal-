<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAMAN PRINT PORTAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5fb;font-family:Arial;color:#172538}
header{background:#12345a;color:white;padding:20px;text-align:center}
.container{max-width:950px;margin:20px auto;padding:12px}
.card{background:white;padding:18px;margin-bottom:16px;border-radius:12px;box-shadow:0 3px 12px #0001}
input,select,textarea{width:100%;padding:12px;margin:7px 0 14px;border:1px solid #ccd5e0;border-radius:7px;font-size:15px}
button{background:#1769aa;color:white;border:0;padding:12px 18px;border-radius:7px;margin:4px;cursor:pointer}
.green{background:#18864b}
.red{background:#c62828}
.hidden{display:none}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:650px}
td,th{padding:10px;border:1px solid #ddd;text-align:left}
th{background:#e8f1fa}
.msg{color:#1769aa;padding:8px}
</style>
</head>
<body>

<header>
<h2>NAMAN PRINT PORTAL</h2>
<p>Online Printing & Digital Services</p>
</header>

<div class="container">

<div class="card" id="authBox">
<h3>NAMAN PRINT PORTAL LOGIN</h3>

<button onclick="chooseLogin('customer')">Customer Login</button>
<button class="green" onclick="chooseLogin('admin')">Admin Login</button>

<h3 id="loginTitle">Customer Login</h3>

<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Login</button>
<button class="green" id="registerBtn" onclick="register()">New Registration</button>

<p id="authMsg" class="msg"></p>
</div>

<div id="customerBox" class="hidden">

<button class="red" onclick="logout()">Logout</button>

<div class="card">
<h3>नया ऑर्डर बुक करें</h3>

<input id="customerName" placeholder="ग्राहक का नाम">
<input id="mobile" placeholder="मोबाइल नंबर" type="tel">

<select id="service">
<option value="">Service चुनें</option>
<option>PAN Card</option>
<option>Aadhaar Card</option>
<option>Printout</option>
<option>Photocopy</option>
<option>Photo</option>
<option>Online Form</option>
<option>Other</option>
</select>

<input id="qty" type="number" min="1" value="1">

<select id="delivery">
<option>Normal</option>
<option>Urgent</option>
</select>

<textarea id="details" placeholder="अन्य जानकारी"></textarea>

<button class="green" onclick="placeOrder()" id="orderBtn">ऑर्डर बुक करें</button>
<p id="orderMsg" class="msg"></p>
</div>

<div class="card">
<h3>मेरे ऑर्डर</h3>
<button onclick="myOrders()">Refresh Orders</button>
<div id="myOrderList"></div>

<div class="card">
  <h3>📁 मेरी फोटो और PDF</h3>
  <label>फोटो या PDF चुनें</label>
  <input type="file" id="customerFile" accept="image/*,.pdf">
  <button class="green" onclick="uploadFile()">Upload करें</button>
  <p id="fileMsg" class="msg"></p>
  <div id="fileList"></div>
</div>
</div>
</div>

<div id="adminBox" class="hidden">

<button class="red" onclick="logout()">Logout</button>

<div class="card">
<h3>Admin Dashboard</h3>

<input id="searchOrder"
placeholder="मोबाइल नंबर या Order Number से Search करें"
oninput="searchOrders()">

<h3>ऑर्डर रिपोर्ट</h3>
<p id="pendingCount">Pending: 0</p>
<p id="completeCount">Completed: 0</p>

<h2 id="totalOrders">कुल ऑर्डर: 0</h2>

<button onclick="loadOrders()">Refresh Orders</button>

<div class="tablewrap">
<table>
<thead>
<tr>
<th>Order No.</th>
<th>Customer</th>
<th>Mobile</th>
<th>Service</th>
<th>Qty</th>
<th>Status</th>
<th>Update</th>
</tr>
</thead>
<tbody id="ordersList"></tbody>
</table>
</div>

<p id="adminMsg" class="msg"></p>
</div>
</div>

</div>

<script>
const SUPABASE_URL="https://nkcqfrfbxjdklprtbmwb.supabase.co";
const SUPABASE_KEY="sb_publishable_sNCyxl8c_knUdRd5Zg6UkQ_QFkKwPom";

const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ADMIN_EMAIL="omveersinghyadav162@gmail.com";

let currentUser=null;
let selectedLoginType="customer";

function el(id){
return document.getElementById(id);
}

function show(id){
["authBox","customerBox","adminBox"].forEach(x=>{
el(x).classList.add("hidden");
});
el(id).classList.remove("hidden");
}

function chooseLogin(type){
selectedLoginType=type;

if(type==="customer"){
el("loginTitle").textContent="Customer Login";
el("authMsg").textContent="ग्राहक अपनी Email और Password डालें।";
el("registerBtn").classList.remove("hidden");
}else{
el("loginTitle").textContent="Admin Login";
el("authMsg").textContent="Admin अपनी Email और Password डालें।";
el("registerBtn").classList.add("hidden");
}
}

async function register(){
if(selectedLoginType!=="customer"){
el("authMsg").textContent="Registration केवल Customer के लिए है।";
return;
}

let email=el("email").value.trim();
let password=el("password").value;

if(!email||password.length<6){
el("authMsg").textContent="Email और कम से कम 6 अक्षर का Password डालें";
return;
}

let {error}=await db.auth.signUp({email,password});

el("authMsg").textContent=error
?error.message
:"Registration सफल! Email confirmation की जरूरत हो सकती है।";
}

async function login(){
let email=el("email").value.trim();
let password=el("password").value;

if(!email||!password){
el("authMsg").textContent="Email और Password भरें।";
return;
}

let isAdmin=email.toLowerCase()===ADMIN_EMAIL.toLowerCase();

if(selectedLoginType==="admin"&&!isAdmin){
el("authMsg").textContent="यह Admin Email नहीं है।";
return;
}

if(selectedLoginType==="customer"&&isAdmin){
el("authMsg").textContent="Admin Login बटन से Login करें।";
return;
}

let {data,error}=await db.auth.signInWithPassword({
email:email,
password:password
});

if(error){
el("authMsg").textContent=error.message;
return;
}

currentUser=data.user;
await dashboard();
}

async function dashboard(){
if(!currentUser)return;

if(currentUser.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()){
show("adminBox");
await loadOrders();
}else{
show("customerBox");
await myOrders();
}
}

async function placeOrder(){
let name=el("customerName").value.trim();
let mobile=el("mobile").value.trim();
let service=el("service").value;
let qty=Number(el("qty").value);

if(!name||!mobile||!service||qty<1){
el("orderMsg").textContent="सभी जरूरी जानकारी भरें";
return;
}

let number="NPP"+Date.now();

let order={
order_number:number,
customer_name:name,
mobile:mobile,
service_name:service,
order_no:number,
user_id:currentUser.id,
name:name,
phone:mobile,
qty:qty,
delivery:el("delivery").value,
details:el("details").value.trim(),
services:service,
status:"नया ऑर्डर"
};

el("orderBtn").disabled=true;

let {error}=await db.from("orders").insert(order);

el("orderBtn").disabled=false;

if(error){
el("orderMsg").textContent="Error: "+error.message;
return;
}

el("orderMsg").textContent="ऑर्डर सफल! Order No: "+number;

el("customerName").value="";
el("mobile").value="";
el("service").value="";
el("qty").value=1;
el("details").value="";

await myOrders();
}

async function myOrders(){
if(!currentUser)return;

let {data,error}=await db.from("orders")
.select("*")
.eq("user_id",currentUser.id)
.order("created_at",{ascending:false});

if(error){
el("myOrderList").textContent=error.message;
return;
}

if(!data.length){
el("myOrderList").textContent="अभी कोई ऑर्डर नहीं है";
return;
}

el("myOrderList").innerHTML=data.map(o=>`
<div class="card">
<b>Order:</b> ${safe(o.order_number||o.order_no)}<br>
<b>Customer:</b> ${safe(o.customer_name||o.name)}<br>
<b>Service:</b> ${safe(o.service_name||o.services)}<br>
<b>Qty:</b> ${o.qty||""}<br>
<b>Status:</b> ${safe(o.status)}
</div>
`).join("");
}

function safe(value){
return String(value??"").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function searchOrders(){
const q=el("searchOrder").value.trim().toLowerCase();

const rows=document.querySelectorAll("#ordersList tr");

rows.forEach(row=>{
row.style.display=row.innerText.toLowerCase().includes(q)?"":"none";
});
}

async function loadOrders(){
let {data,error}=await db.from("orders")
.select("*")
.order("created_at",{ascending:false});

if(error){
el("adminMsg").textContent=error.message;
return;
}

el("totalOrders").textContent="कुल ऑर्डर: "+data.length;

el("pendingCount").textContent="Pending: "+
data.filter(o=>o.status!=="पूरा हुआ"&&o.status!=="रद्द").length;

el("completeCount").textContent="Completed: "+
data.filter(o=>o.status==="पूरा हुआ").length;

el("ordersList").innerHTML=data.map(o=>`
<tr>
<td>${safe(o.order_number||o.order_no)}</td>
<td>${safe(o.customer_name||o.name)}</td>
<td>${safe(o.mobile||o.phone)}</td>
<td>${safe(o.service_name||o.services)}</td>
<td>${o.qty||""}</td>
<td>${safe(o.status)}</td>
<td>
<select id="status${o.id}">
${["नया ऑर्डर","स्वीकार किया","काम जारी","पूरा हुआ","रद्द"]
.map(s=>`<option ${o.status===s?"selected":""}>${s}</option>`).join("")}
</select>
<button onclick="updateStatus(${Number(o.id)})">Update</button>
<button onclick="printReceipt(${Number(o.id)})">Print Receipt</button>
</td>
</tr>
`).join("");

searchOrders();
}

async function printReceipt(id){
const {data,error}=await db.from("orders")
.select("*")
.eq("id",id)
.single();

if(error){
alert("Receipt Error: "+error.message);
return;
}

const receipt=window.open("","_blank");

if(!receipt){
alert("Browser में Pop-ups Allow करें");
return;
}

receipt.document.write(`
<html>
<head>
<title>NAMAN PRINT RECEIPT</title>
<style>
body{font-family:Arial;padding:25px}
.box{border:2px solid #12345a;padding:20px;max-width:500px;margin:auto}
h2{text-align:center;color:#12345a}
hr{border:1px dashed #999}
p{font-size:16px}
</style>
</head>
<body>
<div class="box">
<h2>NAMAN PRINT PORTAL</h2>
<h3 style="text-align:center">ORDER RECEIPT</h3>
<hr>
<p><b>Order No:</b> ${safe(data.order_number||data.order_no)}</p>
<p><b>Customer:</b> ${safe(data.customer_name||data.name)}</p>
<p><b>Mobile:</b> ${safe(data.mobile||data.phone)}</p>
<p><b>Service:</b> ${safe(data.service_name||data.services)}</p>
<p><b>Quantity:</b> ${data.qty||1}</p>
<p><b>Delivery:</b> ${safe(data.delivery)}</p>
<p><b>Status:</b> ${safe(data.status)}</p>
<p><b>Details:</b> ${safe(data.details)}</p>
<hr>
<p style="text-align:center">Thank You!</p>
</div>
<script>window.onload=function(){window.print()}<\/script>
</body>
</html>
`);

receipt.document.close();
}

async function updateStatus(id){
let status=el("status"+id).value;

let {error}=await db.from("orders")
.update({status})
.eq("id",id);

if(error){
el("adminMsg").textContent=error.message;
return;
}

el("adminMsg").textContent="Status Update हो गया!";
await loadOrders();
}

async function logout(){
await db.auth.signOut();
currentUser=null;
show("authBox");
chooseLogin("customer");
el("email").value="";
el("password").value="";
el("authMsg").textContent="Logout सफल!";
}

db.auth.getSession().then(({data,error})=>{
if(error){
show("authBox");
return;
}

if(data.session){
currentUser=data.session.user;
dashboard();
}else{
show("authBox");
}
});

async function uploadFile(){
  const file = el("customerFile").files[0];

  if(!currentUser){
    el("fileMsg").textContent="पहले Login करें";
    return;
  }

  if(!file){
    el("fileMsg").textContent="फोटो या PDF चुनें";
    return;
  }

  if(file.size > 10 * 1024 * 1024){
    el("fileMsg").textContent="फाइल 10 MB से छोटी रखें";
    return;
  }

  const allowed = file.type.startsWith("image/") ||
                  file.type === "application/pdf";

  if(!allowed){
    el("fileMsg").textContent="केवल फोटो या PDF अपलोड करें";
    return;
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const path = currentUser.id + "/" + Date.now() + "_" + safeName;

  el("fileMsg").textContent="Upload हो रहा है...";

  const {data,error} = await db.storage
    .from("customer-files")
    .upload(path,file);

  if(error){
    el("fileMsg").textContent="Error: "+error.message;
    return;
  }

  const {data:urlData,error:urlError} = await db.storage
    .from("customer-files")
    .createSignedUrl(path,3600);

  if(urlError){
    el("fileMsg").textContent="Download लिंक नहीं बना: "+urlError.message;
    return;
  }

  el("fileMsg").innerHTML =
    "Upload सफल! <a href='"+safe(urlData.signedUrl)+"' target='_blank'>Download करें</a>";
  el("customerFile").value="";
}

</script>
</body>
</html>
